  <script>
(function () {
  var cfg = JSON.parse(document.getElementById('cv-cipher').textContent);
  var form = document.getElementById('cv-lock');
  var passEl = document.getElementById('cv-pass');
  var msg = document.getElementById('cv-msg');
  var content = document.getElementById('cv-content');
  var actions = document.getElementById('cv-actions');
  var key = null;

  function b64ToBytes(b64) {
    var bin = atob(b64), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  async function deriveKey(pass) {
    var base = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64ToBytes(cfg.kdf.salt),
        iterations: cfg.kdf.iters, hash: cfg.kdf.hash },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  async function open(bytes, k) {
    var iv = bytes.slice(0, 12), data = bytes.slice(12);
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, k, data);
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!window.crypto || !crypto.subtle) {
      msg.textContent = 'This browser cannot decrypt (no WebCrypto / needs HTTPS).';
      return;
    }
    msg.textContent = 'Decrypting…';
    try {
      var k = await deriveKey(passEl.value);
      var html = await open(b64ToBytes(cfg.html), k);
      content.innerHTML = new TextDecoder().decode(html);
      key = k;
      content.hidden = false;
      form.hidden = true;
      if (cfg.pdf) actions.hidden = false;
    } catch (err) {
      msg.textContent = 'Wrong passphrase. Try again.';
      passEl.select();
    }
  });

  var dl = document.getElementById('cv-dl');
  if (dl) dl.addEventListener('click', async function () {
    if (!key || !cfg.pdf) return;
    dl.disabled = true;
    var label = dl.textContent;
    dl.textContent = 'Decrypting…';
    try {
      var resp = await fetch(cfg.pdf.url);
      var bytes = new Uint8Array(await resp.arrayBuffer());
      var pdf = await open(bytes, key);
      var url = URL.createObjectURL(new Blob([pdf], { type: 'application/pdf' }));
      var a = document.createElement('a');
      a.href = url; a.download = cfg.pdf.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    } catch (err) {
      alert('Could not decrypt the PDF.');
    }
    dl.disabled = false;
    dl.textContent = label;
  });
})();
</script>
